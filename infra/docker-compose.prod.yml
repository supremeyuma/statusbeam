name: statusbeam-prod

# Production-oriented stack. Host ports are intentionally not published for Postgres/Redis.
# Required: JWT_SECRET, JWT_REFRESH_SECRET, ENCRYPTION_KEY in the environment or an .env file
# next to this compose file. See docs/deploy.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statusbeam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: statusbeam
    volumes:
      - statusbeam-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U statusbeam -d statusbeam']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - statusbeam-prod-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      DATABASE_URL: postgres://statusbeam:${POSTGRES_PASSWORD}@postgres:5432/statusbeam
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-statusbeam@example.com}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ['sh', '-c', 'node apps/api/dist/db/migrate.js && node apps/api/dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ''
    environment:
      API_BASE_URL: http://api:3001
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - statusbeam-caddy-data:/data
      - statusbeam-caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  statusbeam-prod-postgres:
  statusbeam-prod-redis:
  statusbeam-caddy-data:
  statusbeam-caddy-config:
